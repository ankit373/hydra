name: Release notes

# Refreshes docs/releases/ from GitHub after a release is published: its files,
# digests and provenance, and any security advisory published since. The release
# PR already carries each page (release-please.yml); this adds what only exists
# once the release does, and opens or updates one PR from bot/release-notes.
# That PR is opened with GITHUB_TOKEN, which starts no workflow: close and reopen
# it to run CI (RELEASING.md).

on:
  workflow_call:
  workflow_dispatch:
  # Advisories are published days or weeks after their release.
  schedule:
    - cron: "30 4 * * 1"

permissions:
  contents: read

concurrency:
  group: release-notes
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh release pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: bot/release-notes
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Fetch and render
        run: |
          python3 docs/releases/generate.py fetch
          python3 docs/releases/generate.py

      - name: Open or update the PR
        run: |
          git add docs/releases docs/sitemap.xml
          if git diff --cached --quiet; then
            echo "release pages are up to date"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "docs(releases): refresh release files, provenance and advisories"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -z "$open" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --title "docs(releases): refresh release files, provenance and advisories" \
              --body "Generated by .github/workflows/release-notes.yml from GitHub's release data. It touches only docs/releases/ and the sitemap's release block. Close and reopen to run CI, then approve to merge (RELEASING.md)."
          fi
