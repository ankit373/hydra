name: Publish (all channels)

# Single source of truth for shipping a release everywhere: binaries + checksums
# (GitHub release), Homebrew tap, npm, and pip. curl (install.sh) needs nothing,
# it always resolves the latest release at runtime.
#
# Called automatically by release-please.yml when a release is created, and
# manually via workflow_dispatch (e.g. to (re)publish an existing tag).
#
# A channel whose credential is missing fails, so a release cannot read green while a
# registry never got it (#1315):
#   HOMEBREW_TAP_GITHUB_TOKEN  → PAT with push access to ankit373/homebrew-hydra
#   PYPI_API_TOKEN             → PyPI API token (publish)
# npm uses trusted publishing (OIDC), so it needs no secret; NPM_TOKEN is only a
# fallback until the trusted publisher is set on npmjs.com.

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.0.1)"
        required: true
        type: string

# Write only where a job uploads to the release; the rest read.
permissions:
  contents: read

# Scripts read the tag as a variable, never spliced into them as ${{ }}.
env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  binaries:
    name: Binaries + checksums (GoReleaser)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: id-token signs it, attestations stores it.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      # Idempotent: if this tag's release already has archives (e.g. a re-run or
      # workflow_dispatch re-publish), skip GoReleaser so it doesn't fail trying
      # to re-upload existing assets, downstream channels still run.
      - name: Check for existing artifacts
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --json assets -q '[.assets[].name | select(endswith(".tar.gz"))] | length' 2>/dev/null || echo 0)
          echo "has_assets=$n" >> "$GITHUB_OUTPUT"
          echo "Existing archive assets: $n"
      - uses: actions/setup-go@v7
        if: ${{ steps.check.outputs.has_assets == '0' }}
        with:
          go-version-file: go.mod
          # No cache: a release builds only what it checked out, nothing another run saved.
          cache: false
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        if: ${{ steps.check.outputs.has_assets == '0' }}
      - name: GoReleaser (build + upload to the release)
        if: ${{ steps.check.outputs.has_assets == '0' }}
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # Exact, not latest or ~> v2: 2.17.1 and 2.18.1 disagree on whether a
          # missing tag is fatal, which killed 24 edge builds unnoticed (#821).
          version: "2.18.2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ inputs.tag }}
      # Signed provenance for every file in checksums.txt (archives and SBOMs),
      # checked by `gh attestation verify` in release-smoke.yml. Only for a build
      # this run made: a skipped build would claim files an earlier run built.
      - name: Attest build provenance
        if: ${{ steps.check.outputs.has_assets == '0' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/checksums.txt

  homebrew:
    name: Homebrew tap
    needs: binaries
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Update tap formula
        if: ${{ env.TAP_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: ./scripts/update-tap-formula.sh "$RELEASE_TAG"
      - name: Missing token
        if: ${{ env.TAP_TOKEN == '' }}
        run: echo "::error::HOMEBREW_TAP_GITHUB_TOKEN is not set, so the tap was not updated." && exit 1

  npm:
    name: npm
    needs: binaries
    runs-on: ubuntu-latest
    # id-token lets npm verify this run by OIDC (trusted publishing), so no token can expire.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g npm@11
      - name: Publish
        working-directory: npm
        env:
          # Used only while no trusted publisher is configured; npm prefers OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm publish --access public

  pip:
    name: pip / PyPI
    needs: binaries
    runs-on: ubuntu-latest
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build + publish
        if: ${{ env.PYPI_API_TOKEN != '' }}
        working-directory: pip
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
          sed -i "s/^__version__ = .*/__version__ = \"$VERSION\"/" hyctl/__init__.py
          python -m pip install --upgrade build twine
          python -m build
          python -m twine upload dist/*
      - name: Missing token
        if: ${{ env.PYPI_API_TOKEN == '' }}
        run: echo "::error::PYPI_API_TOKEN is not set, so PyPI did not get this release." && exit 1

  desktop:
    name: Desktop app
    needs: binaries
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-build.yml
    with:
      version: ${{ inputs.tag }}
      tag: ${{ inputs.tag }}
      upload: true
