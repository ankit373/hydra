# Hydra Workspace Registry
# ─────────────────────────────────────────────────────────────────────────────
# Defines where Hydra agents are allowed to read/edit files. Workspace scoping
# is enforced by dispatch/scope.sh before every file edit. An attempted edit
# outside any defined workspace is rejected, logged, and surfaced to the
# orchestrator.
#
# Each workspace declares:
#   root          — absolute path the workspace covers
#   allowed_globs — paths inside root that may be edited (relative to root)
#   denied_globs  — paths inside root that must NEVER be edited (wins over allowed)
#   git           — auto | true | false
#                   auto: scope.sh walks up from target file to find .git
#                   true: workspace root itself is a git repo
#                   false: no git, edit.sh falls back to .hydra-bak file backup
#
# Default workspace is selected by:
#   1. HYDRA_WORKSPACE env var
#   2. The first workspace whose root contains the target file
#   3. Reject if no match
# ─────────────────────────────────────────────────────────────────────────────

version: "1.0"

# Empty by design.
#
# This file is compiled into the binary (go:embed), so anything here ships to
# every user of every install. It used to carry two absolute roots from the
# maintainer's own machine (/Users/ankitjha/…), which meant a fresh install had
# no workspace that could ever match, and every published artifact leaked one
# person's directory layout (#297).
#
# With no entries here, Hydra falls back to **the git repository you are
# standing in** — allowed_globs "**", minus a denied set covering .git, .env,
# credentials, keys, node_modules and vendor. The fallback is deliberately the
# git root and not the working directory: a bare cwd could be "/" or your home
# directory, and defaulting write scope to either is not a decision to make on
# a user's behalf. Outside a git repository there is no default, and Hydra will
# say it has no workspace rather than guess.
#
# Define workspaces below to override that entirely — the fallback applies only
# when this map yields no usable entry, so a configured registry is never
# widened. Roots must be absolute for the platform Hydra is running on; an entry
# that is not is skipped (and reported), never fatal.
#
#   my-project:
#     root: /absolute/path/to/project
#     git: auto                 # auto | true | false
#     allowed_globs: ["src/**", "test/**"]
#     denied_globs:  ["**/.env*", "**/secrets/**"]

workspaces: {}

# ─────────────────────────────────────────────────────────────────────────────
# Validators — per-extension safety check run after every edit.
# If the validator exits non-zero, edit.sh auto-rolls back and escalates.
# Set to null to skip validation for that extension.
# Override with HYDRA_VALIDATE=off to disable globally.
# ─────────────────────────────────────────────────────────────────────────────

validators:
  js:   "node --check {file}"
  mjs:  "node --check {file}"
  cjs:  "node --check {file}"
  json: "jq empty {file}"
  py:   "python3 -m py_compile {file}"
  yaml: "python3 -c \"import yaml,sys; yaml.safe_load(open(sys.argv[1]))\" {file}"
  yml:  "python3 -c \"import yaml,sys; yaml.safe_load(open(sys.argv[1]))\" {file}"
  sh:   "bash -n {file}"
  # ts/tsx: prefer workspace-local tsc; edit.sh tries `npx --no-install tsc --noEmit {file}` first,
  # falls back to a marker-leakage check only. Declared null here so edit.sh uses its built-in path.
  ts:   null
  tsx:  null
