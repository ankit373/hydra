name: Release Please

# release-please watches for conventional commits on main and:
#   1. Opens a "Release PR" with bumped version + updated CHANGELOG.md, and the
#      docs version pins listed under extra-files in release-please-config.json
#   2. When the Release PR is merged, creates the tag + GitHub release
#      (it merges only after the maintainer approves it, see RELEASING.md)
#   3. This workflow then fans the release out to every channel (binaries,
#      Homebrew, npm, pip) via publish.yml, so a feature release auto-updates
#      everywhere with no manual steps. curl (install.sh) always resolves the
#      latest release at runtime, so it needs nothing.

on:
  push:
    branches:
      - main

# Write is granted per job, to the jobs that publish.
permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # No release-type input: with one set, the action ignores the config file,
          # and with it the extra-files that keep the docs version pins in step.
          # feat bumps minor, fix/perf patch, `!` or BREAKING CHANGE major.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The release PR carries its own notes page (docs/releases/), rendered from the
  # CHANGELOG release-please just wrote and from GitHub, so it lands with the release.
  # A push with GITHUB_TOKEN starts no workflow; CI starts when the PR is reopened (RELEASING.md).
  release-notes-pr:
    name: Release notes on the release PR
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created != 'true' }}
    runs-on: ubuntu-latest
    # Two quick merges render twice; the newer run carries everything the older one would.
    concurrency:
      group: release-notes-pr
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Find the release PR
        id: pr
        run: |
          branch=$(gh pr list --repo "$GITHUB_REPOSITORY" --label 'autorelease: pending' --state open \
            --json headRefName,author -q '[.[] | select(.author.login == "app/github-actions")][0].headRefName // ""')
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: ${{ steps.pr.outputs.branch != '' }}
        with:
          ref: ${{ steps.pr.outputs.branch }}
          persist-credentials: false

      - name: Render the pages onto the release PR
        if: ${{ steps.pr.outputs.branch != '' }}
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          python3 docs/releases/generate.py fetch
          python3 docs/releases/generate.py
          git add docs/releases docs/sitemap.xml
          if git diff --cached --quiet; then
            echo "release pages are up to date"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "docs(releases): notes pages for this release"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"

  publish:
    name: Publish everywhere
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    # A called workflow gets at most its caller's permissions, so npm's OIDC needs id-token here too.
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
  # Installs the release from every channel. It runs even when a publish job
  # failed, since a half-published release is when a check matters most.
  smoke:
    name: Release smoke test
    needs: [release-please, publish]
    if: ${{ !cancelled() && needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/release-smoke.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      expect_latest: true
  # Adds the published files, digests and provenance to the release pages, via a PR.
  release-notes:
    name: Release notes refresh
    needs: [release-please, publish]
    if: ${{ !cancelled() && needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/release-notes.yml
