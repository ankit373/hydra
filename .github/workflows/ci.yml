name: CI

# Only run on PRs targeting main or develop.
# Push to main/develop by admin is trusted — no CI burn on every direct push.
on:
  pull_request:
    branches: [main, develop]

# Cancel any in-progress run for the same branch when a new commit is pushed.
concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    # Only run when shell scripts actually changed
    if: >
      contains(github.event.pull_request.changed_files_url, '.sh') ||
      github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      # Only fail on real errors (SC severity=error).
      # Warnings and style hints are surfaced but don't block the PR.
      - name: Lint shell scripts
        run: |
          shellcheck --severity=error dispatch/*.sh install.sh scripts/*.sh

  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    # Only run when UI source files changed
    if: >
      github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Run typecheck
        working-directory: ui
        run: bun run typecheck

  yaml-lint:
    name: YAML validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Validate registry YAML files
        run: |
          for f in registry/*.yaml; do
            echo "Checking $f"
            yq '.' "$f" > /dev/null
          done

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
