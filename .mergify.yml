# Merge queue for hydra: every PR lands through here, never via the merge button.
# Feature PRs merge into main on green. release-please's PR merges only once the
# maintainer approves it (RELEASING.md). develop is kept until no open PR targets it.
# Mergify reads this file from main only: a change here is live once it merges.

shared:
  # main and release/v* require no checks in GitHub, so the queue requires them.
  ci: &ci
    - check-success=Go build & test (ubuntu-latest)
    - check-success=Go build & test (macos-latest)
    - check-success=Go build & test (windows-latest)
    - check-success=Desktop backend (ubuntu-latest)
    - check-success=Desktop backend (macos-latest)
    - check-success=Desktop backend (windows-latest)
    - check-success=Desktop app build / linux/amd64
    - check-success=Cross-compile (6 targets)
    - check-success=Shellcheck
    - check-success=PowerShell lint
    - check-success=TypeScript typecheck
    - check-success=YAML validation
    - check-success=Secret scan

  # PRs into main also build what a release ships (ci.yml), since merging one publishes.
  release_build: &release_build
    - check-success=Release build (GoReleaser)
    - check-success=Release desktop build / darwin/universal
    - check-success=Release desktop build / windows/amd64
    - check-success=Release desktop build / windows/arm64
    - check-success=Release desktop build / linux/amd64
    - check-success=Release desktop build / linux/arm64

  # Security and config gates (ci.yml). Not in any branch protection yet, so
  # every queue requires them itself.
  security: &security
    - check-success=Go vulnerability scan
    - check-success=Dependency review
    - check-success=Workflow security
    - check-success=Mergify config

  # CLA Assistant's commit status: pending until the author signs, then success.
  # Not in main's branch protection, so the queues require it (allowlisted bots pass it).
  cla: &cla check-success=license/cla

  # release-please derives the bump and changelog from this, so it gates the queue.
  conventional: &conventional 'title~=^(feat|fix|perf|refactor|chore|docs|test|ci|style|build|revert)(\([^)]+\))?!?: \S'

  # GitHub closes the issue when the PR merges into main; without it the issue stays open (#217).
  closes: &closes 'body~=(?i)\b(close[sd]?|fix(e[sd])?|resolve[sd]?) #\d+'

  # A squash leaves release-please nothing to bump without this footer (v1.1.0, #219).
  release_as: &release_as 'body~=(?m)^Release-As:\s*\d+\.\d+\.\d+\s*$'

  # Branches a maintainer promotes to main: a release carry or a hotfix.
  promotion_head: &promotion_head 'head~=^(release/v\d+\.\d+\.\d+-to-main|hotfix/.+)$'

  # A carry must be a feat/fix(release) with a Release-As footer; a hotfix needs neither.
  promotion_shape: &promotion_shape
    or:
      - head~=^hotfix/
      - and:
          - title~=^(feat|fix)\(release\)
          - *release_as

  release_please: &release_please head~=^release-please--
  # A fork can name a branch anything, so the bot and the repo are what identify release-please.
  release_please_bot: &release_please_bot author=github-actions[bot]
  same_repo: &same_repo -from-fork
  # release-please's PR touches CHANGELOG, the manifest and the extra-files in
  # release-please-config.json (the docs version pins); anything else is not its PR.
  release_please_files: &release_please_files -files~=^(?!(CHANGELOG\.md|\.release-please-manifest\.json|README\.md|docs/app\.html|docs/index\.html)$)

  # A release waits while any of these is on its PR (RELEASING.md).
  release_not_held: &release_not_held
    - label!=release:hold
    - label!=release:blocked
  human: &human -author~=\[bot\]$
  dependabot: &dependabot author=dependabot[bot]
  # Mergify's own draft and config PRs are not contributions; protections skip them.
  not_mergify: &not_mergify -author=mergify[bot]

  # Labels a person puts on to say "do not land this yet".
  not_held: &not_held
    - label!=hold
    - label!=do-not-merge
    - label!=wip

merge_queue:
  queue_controls_comment: false
  # One check at a time: the CI matrix is the expensive part, and volume is low.
  max_parallel_checks: 1
  # One comment with the result (merged, or dequeued and why); progress is in the check.
  status_comments: outcomes

defaults:
  queue_rule:
    merge_method: squash
    batch_size: 1
    # About 1.5x the slowest CI run measured (29 min); auto sets no timeout until a queue has ~20 runs.
    checks_timeout: 45 minutes
    # The changelog takes "title (#n)"; release-please reads footers such as Release-As from the body.
    commit_message_format:
      title: pr-title
      body: pr-body

queue_rules:
  # release-please's own PR. Merging it tags and publishes everywhere, so the full CI set
  # must pass first; in queue_conditions, as merge_conditions would check a draft (#1353).
  # The maintainer's approval is the release decision. Queue conditions hold while queued,
  # so a hold label or a dismissed approval (release-please pushed new commits) dequeues it.
  - name: release-please
    queue_conditions:
      - base=main
      - *release_please
      - *release_please_bot
      - *same_repo
      - *release_please_files
      - approved-reviews-by=ankit373
      - and: *release_not_held
      - and: *not_held
      - and: *ci
      - and: *release_build
      - and: *security
    merge_conditions: []

  # Promotion to main from a hand-built carry (commit-tree: release tree, main
  # parent); a release/vX PR itself conflicts on ~500 paths since both squash.
  - name: promote
    queue_conditions:
      - base=main
      - *promotion_head
      - "#approved-reviews-by>=1"
      - author=ankit373
      - -draft
      - *promotion_shape
    merge_conditions:
      - and: *ci
      - and: *release_build
      - and: *security

  # CLA sits in queue_conditions: merge_conditions run on Mergify's draft PR, authored by
  # mergify[bot], not this PR's author. Queue conditions hold while queued.
  - name: release
    queue_conditions:
      - base~=^release/v
      - -draft
      - *conventional
      - *cla
    merge_conditions:
      - and: *ci
      - and: *security
    # merge, not rebase: a Mergify rebase is an unsigned git push (#1079).
    update_method: merge
    # One fresh run for a flaky leg; a second red dequeues, so nothing merges around it.
    max_checks_retries: 1

  # Every other PR into main. After release-please, promote and release, so those
  # match first. Pinned off the release-please bot by author, not by branch name: its
  # PR must never land without the approval its own queue asks for.
  - name: main
    queue_conditions:
      - base=main
      - -draft
      - *conventional
      - *cla
      - -author=github-actions[bot]
    merge_conditions:
      - and: *ci
      - and: *release_build
      - and: *security
    update_method: merge
    max_checks_retries: 1
    batch_size:
      min: 1
      max: 3

  # develop's 13 required checks are injected from branch protection.
  - name: develop
    queue_conditions:
      - base=develop
      - -draft
      - *conventional
      - *cla
    # Branch protection supplies develop's 13 checks; these are on top of them.
    merge_conditions: *security
    update_method: merge
    max_checks_retries: 1
    # Up to 3 PRs share one CI run when a backlog forms; a red batch is split to find the culprit.
    # Safe with signed commits: Mergify signs its queue branch, and each PR still lands as its own squash.
    batch_size:
      min: 1
      max: 3

# First match wins; unmatched PRs are medium.
priority_rules:
  - name: hotfix and security first
    conditions:
      - or:
          - head~=^hotfix/
          # A label, not the title: only a maintainer can apply one, and this rule interrupts running checks.
          - label=security
    priority: high
    allow_checks_interruption: true

  - name: Dependabot last
    conditions:
      - *dependabot
    priority: low

# Reported as one "Mergify Merge Protections" check. Mergify will not merge while it
# fails; make it a required check in branch protection to stop the merge button too.
#
# Freezes are off. For a one-off window: `mergify freeze create --reason ... --timezone
# Asia/Kolkata --start ... --end ... -e "label=hotfix"`, or Merge Protections >
# Scheduled Freezes in the dashboard. For a recurring window, add a rule here with
# `success_conditions: [schedule=Mon-Fri 09:00-18:00[Asia/Kolkata]]`.
merge_protections:
  - name: Conventional title
    description: The squash commit takes the title verbatim and release-please reads it.
    if:
      - *not_mergify
    success_conditions:
      - *conventional

  - name: Closes keyword
    description: GitHub closes the issue from this when the PR merges into main.
    if:
      - *not_mergify
      - *human
      - or:
          - base=main
          - base=develop
          - base~=^release/v
          - head~=^hotfix/
    success_conditions:
      - *closes

  # release-please's PR is the repo's own, so a CLA Assistant outage must not hold a release.
  - name: CLA signed
    description: Every author has signed the CLA with CLA Assistant (license/cla).
    if:
      - *not_mergify
      - not:
          and:
            - *release_please
            - author=github-actions[bot]
    success_conditions:
      - *cla

  - name: Ready to land
    description: Not a draft, and no hold, do-not-merge or wip label.
    if:
      - *not_mergify
    success_conditions:
      - -draft
      - and: *not_held

  - name: Review threads resolved
    description: Every review thread is resolved, on main and release branches too.
    if:
      - *not_mergify
    success_conditions:
      - "#review-threads-unresolved=0"

  # A merged workflow runs with the repo's token and secrets, and main needs no review from others.
  - name: Workflow changes need the maintainer
    description: A change under .github/workflows/ needs ankit373's approval unless they wrote it.
    if:
      - files~=^\.github/workflows/
      - -author=ankit373
      - *not_mergify
    success_conditions:
      - approved-reviews-by=ankit373

  - name: Feature work targets main
    description: feature, feat, chore and docs branches never go to a release branch.
    if:
      - head~=^(feature|feat|chore|docs)/
    success_conditions:
      - base~=^(main|develop)$

  # A fix for a release branch is a fix/ branch into release/vX.Y or release/vX.Y.Z (RELEASING.md).
  - name: Fixes target main or a release branch
    description: fix branches go to main, or to a release branch.
    if:
      - head~=^fix/
    success_conditions:
      - base~=^(main|develop|release/v\d+\.\d+(\.\d+)?)$

pull_request_rules:
  # Opt-in, like vLLM's `ready`: matching on author alone would queue every stale open PR.
  - name: Queue PRs labelled ready
    conditions:
      - base~=^(main|develop|release/v.+)$
      - -draft
      - label=ready
      - and: *not_held
    actions:
      queue:

  # Never an approval from Mergify: the maintainer's own approval is what releases.
  - name: Queue release-please's PR once the maintainer approves it
    conditions:
      - base=main
      - *release_please
      - *release_please_bot
      - *same_repo
      - *release_please_files
      - approved-reviews-by=ankit373
      - -closed
      - -draft
      - and: *release_not_held
      - and: *not_held
    actions:
      queue:

  # main needs one review and the maintainer cannot approve their own PR, so the
  # queue would never take a promotion. Queuing it stays restricted to them.
  - name: Approve the maintainer's promotion to main
    conditions:
      - base=main
      - author=ankit373
      - -draft
      - *promotion_head
      - *promotion_shape
    actions:
      review:
        type: APPROVE
        message: Maintainer's promotion; it ships only when they comment @mergifyio queue.

  # Patch and minor bumps are routine; the queue still waits for every check.
  - name: Queue Dependabot patch and minor bumps
    conditions:
      - *dependabot
      - base~=^(main|develop)$
      - -draft
      - "#dependabot-update-type>=1"
      - -dependabot-update-type=version-update:semver-major
      - and: *not_held
    actions:
      queue:

  # Hygiene bots, modelled on vLLM's: they comment and label; the protections above block.
  - name: Conventional title missing
    conditions:
      - -closed
      - -draft
      - not: *conventional
    actions:
      comment:
        message: |
          @{{author}}, the title must be a conventional commit, e.g. `fix(dispatch): nil panic on empty prompt`.
          The squash commit takes it verbatim and release-please reads it, so the queue will not take this PR
          until it is.

  - name: Closes keyword missing
    conditions:
      - base~=^(main|develop)$
      - -closed
      - -draft
      - *human
      - not: *closes
    actions:
      comment:
        message: |
          @{{author}}, add `Closes #<issue>` to the description. GitHub closes the issue when this merges
          into main, so without it the issue stays open for ever (#217).

  - name: Release PR missing Release-As footer
    conditions:
      - base=main
      - head~=^release/v.+-to-main$
      - -closed
      - not: *release_as
    actions:
      comment:
        message: |
          This release PR has no `Release-As: X.Y.Z` footer. Without it the squash leaves release-please nothing
          to bump and no release is made, silently (v1.1.0, #219). The queue will not take it until it has one.

  # needs-rebase is the old name of this label; it goes when the conflict does.
  - name: Conflict
    conditions:
      - conflict
      - -closed
    actions:
      label:
        add: [conflict]
        remove: [needs-rebase]
      comment:
        message: |
          @{{author}}, this conflicts with `{{base}}`. Rebase on it and force-push your branch; the queue
          skips it until then.

  - name: Conflict resolved
    conditions:
      - -conflict
    actions:
      label:
        remove: [conflict, needs-rebase]

  # A workflow edit runs with repo secrets on the next push; the maintainer reviews it.
  - name: Workflow change
    conditions:
      - -closed
      - files~=^\.github/workflows/
    actions:
      label:
        add: [workflow-change]
      request_reviews:
        users: [ankit373]

  - name: Assign the author
    conditions:
      - -closed
      - *human
      - "#assignee=0"
    actions:
      assign:
        add_users: ["{{author}}"]

  # Add only: the label itself bumps updated-at, so an auto-remove rule would flap.
  - name: Stale
    conditions:
      - -closed
      - updated-at<21 days ago
      - label!=hold
      - -head~=^release
    actions:
      label:
        add: [stale]
      comment:
        message: |
          @{{author}}, nothing has happened here for 21 days. Push, comment or close it, and remove the `stale` label
          when you pick it back up.

  # Size from the larger of added and deleted lines; toggle moves the label as the PR grows.
  - name: size/XS
    conditions:
      - "#added-lines<10"
      - "#deleted-lines<10"
    actions: {label: {toggle: [size/XS]}}

  - name: size/S
    conditions:
      - "#added-lines<100"
      - "#deleted-lines<100"
      - or: ["#added-lines>=10", "#deleted-lines>=10"]
    actions: {label: {toggle: [size/S]}}

  - name: size/M
    conditions:
      - "#added-lines<500"
      - "#deleted-lines<500"
      - or: ["#added-lines>=100", "#deleted-lines>=100"]
    actions: {label: {toggle: [size/M]}}

  - name: size/L
    conditions:
      - "#added-lines<1000"
      - "#deleted-lines<1000"
      - or: ["#added-lines>=500", "#deleted-lines>=500"]
    actions: {label: {toggle: [size/L]}}

  - name: size/XL
    conditions:
      - or: ["#added-lines>=1000", "#deleted-lines>=1000"]
    actions: {label: {toggle: [size/XL]}}

  # Area labels: one per real directory, so a reviewer can filter by what a PR touches.
  - name: area/desktop
    conditions: [-closed, files~=^desktop/]
    actions: {label: {add: [area/desktop]}}

  - name: area/trust
    conditions:
      - -closed
      - or: [files~=^internal/trust/, files~=^cmd/hydra/trust_]
    actions: {label: {add: [area/trust]}}

  - name: area/mcp
    conditions:
      - -closed
      - or: [files~=^internal/mcpregistry/, files~=^desktop/api/mcp, files~=^desktop/frontend/src/views/MCP]
    actions: {label: {add: [area/mcp]}}

  - name: area/serve
    conditions:
      - -closed
      - or: [files~=^internal/serve/, files~=^cmd/hydra/serve]
    actions: {label: {add: [area/serve]}}

  - name: area/executor
    conditions: [-closed, files~=^internal/executor/]
    actions: {label: {add: [area/executor]}}

  - name: area/registry
    conditions: [-closed, files~=^registry/]
    actions: {label: {add: [area/registry]}}

  - name: area/ci
    conditions:
      - -closed
      - or:
          - files~=^\.github/
          - files~=^ci/
          - files~=^scripts/
          - files~=^(npm|pip)/
          - files~=^install(-app)?\.(sh|ps1)$
          - files=.goreleaser.yaml
          - files=.mergify.yml
    actions: {label: {add: [area/ci]}}

  - name: area/docs
    conditions:
      - -closed
      - or:
          - files~=^docs/
          - files~=^[A-Z]+\.md$
    actions: {label: {add: [area/docs]}}

  - name: label-dependencies
    conditions:
      - -closed
      - or:
          - files~=(^|/)go\.(mod|sum)$
          - files~=(^|/)package(-lock)?\.json$
    actions: {label: {add: [dependencies]}}

  - name: label-release
    conditions:
      - -closed
      - or:
          - head~=^release/v
          - *release_please
          - head~=^hotfix/
    actions: {label: {add: [release]}}

# The comment is the ship button: only the maintainer can queue anything by hand.
commands_restrictions:
  queue:
    conditions:
      - sender=ankit373
