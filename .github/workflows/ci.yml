name: CI

on:
  pull_request:
    branches: [main, develop]

# Cancel any in-progress run for the same branch when a new commit is pushed.
concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Formatting is checked before anything expensive runs — it is the
      # cheapest failure to produce and the cheapest to fix.
      - name: Gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt'd:"
            echo "$unformatted"
            gofmt -d ./cmd ./internal
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # staticcheck must be BUILT with the same toolchain it analyses. Its own
      # go.mod asks for go1.25, so a plain `go install` builds it on go1.25 and
      # it then rejects every go1.26 stdlib file it parses ("file requires newer
      # Go version"), failing the whole run. Pinning GOTOOLCHAIN to whatever
      # this module actually resolved to keeps the two in step without
      # hardcoding a version that would drift from go.mod.
      - name: Install staticcheck
        run: GOTOOLCHAIN=$(go env GOVERSION) go install honnef.co/go/tools/cmd/staticcheck@2026.1

      - name: Staticcheck
        run: staticcheck ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -race

  desktop:
    name: Desktop backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: true

      # desktop/ is its own module, so the root job's `./...` does not reach it.
      # Without this job its tests would silently never run.
      #
      # No build tag here: desktop/main.go is the only file that imports Wails
      # and it is behind `//go:build desktop`, so nothing on this runner needs
      # libwebkit2gtk. desktop/api — the part with the tests — imports no UI
      # framework at all.
      - name: Gofmt
        working-directory: desktop
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt'd:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: Vet
        working-directory: desktop
        run: go vet ./...

      # Same reasoning as the root job: staticcheck must be built with the
      # toolchain it analyses.
      - name: Install staticcheck
        working-directory: desktop
        run: GOTOOLCHAIN=$(go env GOVERSION) go install honnef.co/go/tools/cmd/staticcheck@2026.1

      - name: Staticcheck
        working-directory: desktop
        run: staticcheck ./...

      - name: Test
        working-directory: desktop
        run: go test ./... -race

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      # Only fail on real errors (SC severity=error).
      # Warnings and style hints are surfaced but don't block the PR.
      - name: Lint shell scripts
        run: |
          shellcheck --severity=error install.sh

  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # This job used to typecheck ui/, the Ink TUI removed in #197. It now
      # covers the desktop frontend, which had no CI coverage at all — its
      # types.ts mirrors the Go DTOs by hand, so a compile error there is
      # exactly the kind of drift CI should catch.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Typecheck
        working-directory: desktop/frontend
        run: npm run typecheck

      # The production bundle must build, not merely typecheck — `wails build`
      # runs this exact command before it compiles any Go.
      - name: Build
        working-directory: desktop/frontend
        run: npm run build

  yaml-lint:
    name: YAML validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Validate registry YAML files
        run: |
          for f in registry/*.yaml; do
            echo "Checking $f"
            yq '.' "$f" > /dev/null
          done

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
