# Hydra Pricing Registry
# ─────────────────────────────────────────────────────────────────────────────
# Per-tier $/1M tokens. Used by route.sh to compute estimated cost per call
# from prompt + response token counts and append to logs/cost.jsonl.
#
# Prices reflect public list rates as of 2026-05. Antigravity costs are
# zero-out-of-pocket on the user's plan but we track *estimated retail* so
# the cost dashboard surfaces what an equivalent direct-API run would have
# cost, useful for future tier-shift decisions.
#
# `estimate_factor` for executors without real token counts:
#   token_count ≈ char_count / estimate_factor
# Defaults to 4 (Anthropic + most providers).
#
# Update prices by editing this file, no code change required.
# ─────────────────────────────────────────────────────────────────────────────

version: "1.0"

# Default factor when an executor doesn't expose real token counts
estimate_factor: 4

# ── Tier → pricing (per million tokens) ──────────────────────────────────────
tiers:

  1:  # Claude Code (CORE)
    id: claude-core
    input_per_million: 15.00     # Opus equivalent retail
    output_per_million: 75.00
    notes: "Orchestrator, direct Anthropic billing"

  2:  # Opus Thinking via agy
    id: opus-thinking
    input_per_million: 15.00
    output_per_million: 75.00
    notes: "Antigravity proxies Anthropic, track retail equivalent"

  3:  # Sonnet Thinking via agy
    id: sonnet-thinking
    input_per_million: 3.00
    output_per_million: 15.00

  4:  # GPT-OSS 120B via agy
    id: gpt-oss-120b
    input_per_million: 0.40      # OSS hosted pricing approximation
    output_per_million: 0.80

  5:  # Gemini 3.1 Pro (High)
    id: pro-high
    input_per_million: 2.50
    output_per_million: 10.00

  6:  # Gemini 3.1 Pro (Low)
    id: pro-low
    input_per_million: 1.25
    output_per_million: 5.00

  7:  # Gemini 3.5 Flash (High)
    id: flash-high
    input_per_million: 0.30
    output_per_million: 2.50

  8:  # Gemini 3.5 Flash (Medium)
    id: flash-med
    input_per_million: 0.15
    output_per_million: 1.25

  9:  # Gemini 3.5 Flash (Low)
    id: flash-low
    input_per_million: 0.075
    output_per_million: 0.625

  10:  # Qwen2.5-Coder 7b (local)
    id: qwen-grunt
    input_per_million: 0.00      # local, no $ cost
    output_per_million: 0.00
    notes: "Local Ollama, compute cost only"

# ── Pool budgets (informational; for cost.sh totals) ─────────────────────────
pool_budgets:
  claude_direct:    null         # pay-as-you-go
  agy_claude:       null         # included in Antigravity plan
  agy_gemini_pro:   null
  agy_flash:        null
  agy_gpt:          null
  local_ollama:     null
