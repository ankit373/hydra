[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hyctl"
version = "1.0.1"
description = "Hydra (hyctl), local-first, multi-vendor AI control plane. Routes each task to the cheapest model on your machine that clears your target confidence."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "ankit373" }]
keywords = ["ai", "llm", "orchestration", "cli", "router", "ollama", "local-first"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://hydra.uvansa.com"
Source = "https://github.com/ankit373/hydra"
Issues = "https://github.com/ankit373/hydra/issues"

[project.scripts]
hyctl = "hyctl:main"

[tool.setuptools]
packages = ["hyctl"]
