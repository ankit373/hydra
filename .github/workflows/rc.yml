name: RC Build

on:
  push:
    branches:
      - "release/v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rc:
    name: Build & publish RC release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Compute RC version
        id: ver
        run: |
          # Branch is release/v1.2.0 → extract semver
          BRANCH="${GITHUB_REF_NAME}"
          SEMVER="${BRANCH#release/}"
          SHA=$(git rev-parse --short HEAD)

          # Count how many RC tags already exist for this version
          RC_COUNT=$(git tag --list "${SEMVER}-rc.*" | wc -l | tr -d ' ')
          RC_NUM=$((RC_COUNT + 1))
          RC_TAG="${SEMVER}-rc.${RC_NUM}"

          echo "version=${RC_TAG}" >> "$GITHUB_OUTPUT"
          echo "tag=${RC_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          # GoReleaser's {{ .Version }} is the semver without the leading v, so
          # the archive filenames need this form and not the tag (#759).
          echo "semver=${RC_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build RC binaries
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          # --snapshot made GoReleaser compute its own 0.0.0-SNAPSHOT version
          # and ignore the tag, so every RC shipped CLI archives that could not
          # say which release they stood for (#705). It was presumably there
          # because a plain `release` refuses when HEAD carries no tag, which is
          # always true here: the tag is created afterwards, by `gh release
          # create`. Skipping validate is what actually addresses that, and it
          # keeps GORELEASER_CURRENT_TAG as the version.
          args: release --clean --skip=publish,sign,sbom,validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.ver.outputs.version }}

      - name: Publish RC release
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" dist/*.tar.gz dist/*.zip dist/checksums.txt \
            --target "${{ github.sha }}" \
            --title "RC, ${{ steps.ver.outputs.version }}" \
            --notes "$(cat <<'EOF'
          > 🧪 **This is a release candidate**, built from \`${{ github.ref_name }}\` for UAT testing.
          > Do not use in production. Stable release pending sign-off.

          **Branch**: \`${{ github.ref_name }}\`
          **Commit**: \`${{ steps.ver.outputs.sha }}\`
          **Version**: \`${{ steps.ver.outputs.version }}\`

          **Install RC build**
          \`\`\`bash
          # macOS (Apple Silicon)
          curl -L https://github.com/ankit373/hydra/releases/download/${{ steps.ver.outputs.tag }}/hydra_${{ steps.ver.outputs.semver }}_darwin_arm64.tar.gz | tar xz
          sudo mv hyctl /usr/local/bin/
          \`\`\`
          EOF
          )" \
            --prerelease \
            --latest=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # UAT needs the app, not just the CLI. Without this the RC that testers sign
  # off on contains no desktop build at all (#227).
  desktop:
    name: Desktop app
    needs: rc
    uses: ./.github/workflows/desktop-build.yml
    with:
      version: ${{ needs.rc.outputs.version }}
      tag: ${{ needs.rc.outputs.tag }}
      upload: true
