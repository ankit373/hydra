# git-cliff configuration — generates CHANGELOG.md from conventional commits
# Docs: https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to Hydra are documented here.
Format: [Semantic Versioning](https://semver.org) — generated by [git-cliff](https://git-cliff.org).\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{{ commit.message | upper_first }} \
([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/ankit373/hydra/commit/{{ commit.id }}))\
{% if commit.github.pr_number %} ([#{{ commit.github.pr_number }}](https://github.com/ankit373/hydra/pull/{{ commit.github.pr_number }})){% endif %}\
{% endfor %}
{% endfor %}\n
"""
trim = true
footer = """
---
*Generated by [git-cliff](https://git-cliff.org)*
"""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/ankit373/hydra/issues/${2}))" },
]
commit_parsers = [
  { message = "^feat",                        group = "✨ New Features"     },
  { message = "^fix",                         group = "🐛 Bug Fixes"        },
  { message = "^perf",                        group = "⚡ Performance"       },
  { message = "^refactor",                    group = "🏗 Internal"          },
  { message = "^chore\\(deps\\)",             group = "📦 Dependencies"      },
  { body    = ".*BREAKING[ -]CHANGE.*",       group = "⚠️ Breaking Changes"  },
  { message = "^chore|^docs|^style|^test|^ci|^build", skip = true          },
]
filter_commits = true
tag_pattern = "v[0-9].*"
ignore_tags = ".*-edge\\..*"    # exclude edge/nightly auto-tags
topo_order = false
sort_commits = "newest"
