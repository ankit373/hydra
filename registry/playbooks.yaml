# Hydra Playbooks — named end-to-end company processes
# ─────────────────────────────────────────────────────────────────────────────
# A playbook is a deterministic sequence of stages the brain walks through.
# Each stage delegates to a skill (via Skill tool), the brain itself, or the
# tier-dispatch substrate (route.sh / parallel.sh / edit.sh).
#
# Read by ~/hydra/dispatch/company.sh which:
#   1. Resolves `when:` conditions against the run's `inputs` block
#   2. Emits an immutable `manifest.json` per run (conditionals already pruned)
#   3. Tracks progress through `state.json`, advancing one stage at a time
#
# Stage shape:
#   name           — kebab_case identifier (unique within playbook)
#   invocation:    — how the stage is executed:
#                      { type: skill, skill: <name>, mode: <opt> }
#                      { type: brain }
#                      { type: tier_dispatch }
#                      { type: parallel, items: [ {label, skill, when?} ] }
#   when           — input-key boolean (e.g. has_ui) or "always"
#   gate           — human | auto | optional
#                    human   = brain pauses, summarizes, asks user
#                    auto    = advance immediately on stage success
#                    optional= brain can decide to skip
#   inputs_from    — list of prior stage names whose outputs feed this stage
#   outputs        — informational list of artifact filenames
#   mode           — passed to the skill if it accepts modes
#   block_on       — list of finding severities that hard-stop the run
#                    (brain reports completion with --findings <severity>...)
#   duration_minutes — soft budget for monitoring/long-running stages
# ─────────────────────────────────────────────────────────────────────────────

version: "1.0"

playbooks:

  # ═════════════════════════════════════════════════════════════════════════════
  # ship_a_feature — full company pipeline
  # plan → review → finalize → threat-model → harden → build → review-board →
  # qa → visual_qa → perf → security_audit → ship → deploy → monitor → docs → learn
  # ═════════════════════════════════════════════════════════════════════════════

  ship_a_feature:
    description: |
      Full company pipeline. Plan-heavy front, security-bookended (threat-model
      the plan, comprehensive audit the code). Each gate is a human checkpoint.
    requires_ticket_choice: true   # cmd_start fails if neither --ticket-ref
                                   # nor --ticket-mode is explicitly provided
                                   # (forces the brain to ask the user)
    inputs:
      intent:     { type: string, required: true }
      has_ui:     { type: bool,   default: false }
      dev_facing: { type: bool,   default: false }

    stages:

      # ── 1. Draft a plan from the intent (brain writes plan.md) ──────────────
      - name: draft_plan
        invocation: { type: brain }
        gate: human
        outputs: [plan.md]

      # ── 2. Parallel plan review board (CEO + Eng always, Design/DX conditional)
      - name: plan_review_board
        invocation:
          type: parallel
          items:
            - { label: ceo,    skill: plan-ceo-review }
            - { label: eng,    skill: plan-eng-review }
            - { label: design, skill: plan-design-review, when: has_ui }
            - { label: devex,  skill: plan-devex-review,  when: dev_facing }
        inputs_from: [draft_plan]
        gate: human
        outputs: [ceo/review.md, eng/review.md, design/review.md, devex/review.md]

      # ── 3. Brain merges review feedback into plan-v2.md ────────────────────
      - name: finalize_plan
        invocation: { type: brain }
        inputs_from: [draft_plan, plan_review_board]
        gate: human
        outputs: [plan-v2.md]

      # ── 4. Shift-left security: threat-model the plan ──────────────────────
      - name: threat_model
        invocation: { type: skill, skill: cso, mode: threat-model }
        inputs_from: [finalize_plan]
        gate: human
        outputs: [security-report.md, findings.json]

      # ── 5. Brain bakes mitigations into plan-final.md (brain can skip if
      #      threat_model returned no findings — reports complete --status skipped)
      - name: harden_plan
        invocation: { type: brain }
        inputs_from: [finalize_plan, threat_model]
        gate: human
        outputs: [plan-final.md]

      # ── 6. Implementation: brain decomposes plan into parallel tasks ───────
      - name: implement
        invocation: { type: tier_dispatch }
        inputs_from: [harden_plan, finalize_plan]
        gate: auto
        outputs: [tasks.json, last_parallel.json]

      # ── 7. Parallel code review (senior + simplify pass) ───────────────────
      - name: code_review_board
        invocation:
          type: parallel
          items:
            - { label: senior,   skill: review }
            - { label: simplify, skill: simplify }
        inputs_from: [implement]
        gate: auto
        outputs: [senior/review.md, simplify/edits/]

      # ── 8. Functional QA ───────────────────────────────────────────────────
      - name: qa
        invocation: { type: skill, skill: qa, mode: standard }
        inputs_from: [implement]
        gate: auto
        outputs: [qa-report.md]

      # ── 9. Visual QA on the running site (only for UI changes) ─────────────
      - name: visual_qa
        invocation: { type: skill, skill: design-review }
        inputs_from: [implement]
        when: has_ui
        gate: auto
        outputs: [design-audit.md]

      # ── 10. Performance regression check ───────────────────────────────────
      - name: perf_check
        invocation: { type: skill, skill: benchmark }
        inputs_from: [implement]
        gate: auto
        outputs: [benchmark.json, regression-report.md]

      # ── 11. Deep security audit on the actual code (BLOCKING) ──────────────
      - name: security_audit
        invocation: { type: skill, skill: cso, mode: comprehensive }
        inputs_from: [implement]
        gate: human
        block_on: [critical, high]
        outputs: [security-report.md, findings.json]

      # ── 12. Ship: create the PR ────────────────────────────────────────────
      - name: ship
        invocation: { type: skill, skill: ship }
        inputs_from: [implement, code_review_board, qa, security_audit]
        gate: human
        outputs: [pr_url.txt]

      # ── 13. Land + deploy ──────────────────────────────────────────────────
      - name: deploy
        invocation: { type: skill, skill: land-and-deploy }
        inputs_from: [ship]
        gate: auto
        outputs: [deploy_status.json]

      # ── 14. Canary watch ───────────────────────────────────────────────────
      - name: monitor
        invocation: { type: skill, skill: canary }
        inputs_from: [deploy]
        gate: auto
        duration_minutes: 30
        outputs: [canary-report.md]

      # ── 15. Update documentation ───────────────────────────────────────────
      - name: document
        invocation: { type: skill, skill: document-release }
        inputs_from: [implement]
        gate: auto
        outputs: [doc-changes.md]

      # ── 16. Capture institutional memory ───────────────────────────────────
      - name: learn
        invocation: { type: skill, skill: learn }
        inputs_from: [ALL]
        gate: auto
        outputs: [learnings.md]

  # ═════════════════════════════════════════════════════════════════════════════
  # business_to_design — upstream of ship_a_feature
  # Evaluate whether something is worth building, validate it as a business,
  # design the product, then hand off (a separate ship_a_feature run continues
  # the chain). The brain wears different "hats" (brain_role) per stage.
  # ═════════════════════════════════════════════════════════════════════════════

  business_to_design:
    description: |
      Phase A (business validation) + Phase B (product spec) + Phase C
      (design). Produces a locked product spec + design + a ship-handoff
      brief. Brain then starts a separate ship_a_feature run with the
      handoff brief as the intent.
    requires_ticket_choice: false   # ticket usually created mid-flow, after spec locks
    inputs:
      intent:               { type: string, required: true }
      market:               { type: string, default: "" }       # optional hint, e.g. "devtools"
      has_ui:               { type: bool,   default: true }
      dev_facing:           { type: bool,   default: false }
      needs_design_system:  { type: bool,   default: false }    # set true if no DESIGN.md yet

    stages:

      # ── PHASE A — Business validation ──────────────────────────────────────

      # 1. Market research (brain uses WebSearch + WebFetch as market analyst)
      - name: market_research
        invocation: { type: brain, brain_role: market_analyst }
        gate: human
        outputs: [market-research.md]

      # 2. Competitive landscape (brain researches competitors via web)
      - name: competitive_landscape
        invocation: { type: brain, brain_role: competitive_analyst }
        inputs_from: [market_research]
        gate: human
        outputs: [competitors.md]

      # 3. Gap analysis (brain synthesizes — what's missing, where's the wedge)
      - name: gap_analysis
        invocation: { type: brain, brain_role: strategist }
        inputs_from: [market_research, competitive_landscape]
        gate: human
        outputs: [gaps.md, opportunity-map.md]

      # 4. Parallel business validation — CEO strategic review + YC office hours
      - name: business_validation_board
        invocation:
          type: parallel
          items:
            - { label: ceo,          skill: plan-ceo-review }
            - { label: office_hours, skill: office-hours }
        inputs_from: [gap_analysis]
        gate: human
        outputs: [ceo/review.md, office_hours/forcing-questions.md]

      # 5. Go / no-go decision (CEO hat — synthesize and commit)
      - name: business_decision
        invocation: { type: brain, brain_role: ceo }
        inputs_from: [business_validation_board, gap_analysis]
        gate: human
        outputs: [go-no-go.md]

      # ── PHASE B — Product management ───────────────────────────────────────

      # 6. Product spec (PM hat — translate business decision into spec
      #    AND produce a prioritized feature backlog. Each backlog entry is
      #    a candidate intent for an independent ship_a_feature run.)
      - name: product_spec
        invocation: { type: brain, brain_role: product_manager }
        inputs_from: [business_decision, gap_analysis]
        gate: human
        outputs: [product-spec.md, user-stories.md, feature-backlog.json]

      # 7. Engineering manager reviews PM spec for execution feasibility
      - name: product_eng_review
        invocation: { type: skill, skill: plan-eng-review }
        inputs_from: [product_spec]
        gate: human
        outputs: [eng-review.md]

      # 8. DX review if the product is developer-facing
      - name: product_dx_review
        invocation: { type: skill, skill: plan-devex-review }
        inputs_from: [product_spec]
        when: dev_facing
        gate: human

      # ── PHASE C — Design ──────────────────────────────────────────────────

      # 9. Build the design system (skipped if DESIGN.md exists)
      - name: design_consultation
        invocation: { type: skill, skill: design-consultation }
        inputs_from: [product_spec]
        when: needs_design_system
        gate: human
        outputs: [DESIGN.md]

      # 10. Variant exploration
      - name: design_shotgun
        invocation: { type: skill, skill: design-shotgun }
        inputs_from: [product_spec]
        when: has_ui
        gate: human
        outputs: [variants/, comparison-board.md]

      # 11. Designer reviews the selected variant against the plan
      - name: design_review
        invocation: { type: skill, skill: plan-design-review }
        inputs_from: [design_shotgun, product_spec]
        when: has_ui
        gate: human

      # 12. Lock the design (design director hat — pick winner, finalize)
      - name: design_lock
        invocation: { type: brain, brain_role: design_director }
        inputs_from: [design_shotgun, design_review]
        when: has_ui
        gate: human
        outputs: [design-final.md]

      # ── HANDOFF ────────────────────────────────────────────────────────────

      # 13. Compose the ship-handoff brief — exact intent string for the
      #     follow-up ship_a_feature run. Brain offers to start the next run.
      - name: ship_handoff
        invocation: { type: brain, brain_role: orchestrator }
        inputs_from: [product_spec, design_lock]
        gate: human
        outputs: [ship-handoff.md]
