# Hydra Model Registry
# ─────────────────────────────────────────────────────────────────────────────
# Defines every model head: tier, executor, token pool, speed, and accuracy.
# Tier numbers are referenced by routing.yaml (the enum file).
#
# To add a model    → add an entry, assign a unique tier
# To swap a model   → change model_flag only
# To reorder tiers  → change tier number AND update routing.yaml to match
# To disable        → set enabled: false (route.sh auto-escalates)
# ─────────────────────────────────────────────────────────────────────────────
#
# ⚠️  model_flag VALUES ARE INSTALL-SPECIFIC DEFAULTS, VERIFY, DON'T TRUST.
# The `model_flag` and version-bearing `name` fields below (e.g. agy Claude/Gemini
# tiers) are provider-INTERNAL identifiers that only resolve on YOUR specific
# Antigravity / Ollama / API installation. They are starting defaults, NOT a
# guarantee that a given model or version is current or available to you.
# Before relying on a tier, confirm its model_flag actually exists in your
# provider (agy model list · `ollama list` · the provider's API). Mismatched
# flags fail at dispatch and route.sh auto-escalates to the next tier.
# (A `hydra doctor` command that validates these against live providers is planned.)
# ─────────────────────────────────────────────────────────────────────────────

version: "1.0"

# ─────────────────────────────────────────────────────────────────────────────
# TOKEN POOLS, shared quotas across models from the same provider/plan
# Key insight: models in the same pool compete for the same monthly budget.
# Use lower tiers in a pool when running low to preserve quota for harder tasks.
# ─────────────────────────────────────────────────────────────────────────────

token_pools:

  claude_direct:
    members: [claude-core]
    quota: "Anthropic API billing, per token"
    shared: false
    note: "Direct Claude Code usage. Billed separately from agy."

  agy_claude:
    members: [opus-thinking, sonnet-thinking]
    quota: "Shared Antigravity Claude allocation"
    shared: true
    note: >
      Opus and Sonnet consume from the SAME pool in Antigravity.
      Prefer Sonnet for tasks that don't strictly need Opus depth.
      Reserve Opus for genuine architecture/research-level work.

  agy_gemini_pro:
    members: [pro-high, pro-low]
    quota: "Shared Antigravity Gemini Pro allocation"
    shared: true
    note: >
      Pro High and Pro Low share the same token pool.
      Pro Low uses fewer tokens per call (lower compute).
      Default to Pro Low unless High reasoning quality is needed.

  agy_flash:
    members: [flash-high, flash-med, flash-low]
    quota: "High-volume Antigravity Flash allocation"
    shared: true
    note: >
      Flash has significantly higher token quota than Pro or Claude.
      Freely usable for standard and simple tasks.
      Lower accuracy ceiling, do not use for complex logic.

  agy_flash_thinking:
    members: [flash-thinking]
    quota: "Antigravity Gemini Flash Thinking allocation"
    shared: false
    note: "Use as rubber duck reviewer for Claude output. Thinking-mode Gemini, different family from Claude avoids shared blind spots."

  local_ollama:
    members: [qwen-grunt]
    quota: "Unlimited, runs locally"
    shared: false
    note: >
      Free but constrained by local compute (Apple Silicon).
      Expect 10-40 tok/s on M-series. Slow for long prompts.
      Only use for purely mechanical, short-output tasks.

# ─────────────────────────────────────────────────────────────────────────────
# MODEL DEFINITIONS
# ─────────────────────────────────────────────────────────────────────────────

models:

  - tier: 1
    id: claude-core
    name: "Claude Code"
    provider: claude
    executor: claude
    model_flag: null
    token_pool: claude_direct
    enabled: true
    context_window: 200000
    tokens_per_call: high
    speed: medium            # thoughtful, not instant
    accuracy: highest
    frequency: use_sparingly # most expensive, highest value
    strengths:
      - core business logic
      - system architecture decisions
      - orchestration and routing
      - security-critical code
      - final review and integration
    complexity_min: 9
    complexity_max: 10
    notes: "Handled directly by orchestrator. Never spawned as subprocess."

  - tier: 2
    id: opus-thinking
    name: "Claude Opus 4.6 (Thinking)"
    provider: antigravity
    executor: agy
    model_flag: "claude-opus-4-6-thinking"
    token_pool: agy_claude
    enabled: true
    context_window: 200000
    tokens_per_call: very_high
    speed: slow              # thinking mode takes time
    accuracy: very_high
    frequency: use_sparingly # shares pool with Sonnet, preserve for expert tasks
    strengths:
      - hard multi-step reasoning
      - complex algorithm design
      - architecture tradeoff analysis
      - security threat modelling
      - novel approaches
    complexity_min: 7
    complexity_max: 8

  - tier: 3
    id: sonnet-thinking
    name: "Claude Sonnet 4.6 (Thinking)"
    provider: antigravity
    executor: agy
    model_flag: "claude-sonnet-4-6"
    token_pool: agy_claude
    enabled: true
    context_window: 200000
    tokens_per_call: high
    speed: medium_slow
    accuracy: high
    frequency: moderate      # same pool as Opus, use when Opus not needed
    strengths:
      - complex service logic
      - multi-file refactoring
      - non-trivial algorithms
      - data pipeline design
    complexity_min: 6
    complexity_max: 7
    notes: "Prefer over Opus for tasks that need reasoning but not extreme depth. Same token pool."

  - tier: 4
    id: flash-thinking
    name: "Gemini 2.0 Flash Thinking"
    provider: antigravity
    executor: agy
    model_flag: "gemini-2.0-flash-thinking-exp"
    token_pool: agy_flash_thinking
    # agy no longer offers a thinking-flash model, and nothing it does offer is
    # a like-for-like replacement. Off rather than repointed: choosing a
    # stand-in is a routing decision, not a data fix. `agy models` lists what
    # this install actually has.
    enabled: false
    context_window: 1000000
    tokens_per_call: medium
    speed: fast
    accuracy: high
    frequency: moderate
    strengths:
      - cross-model rubber duck reviewing
      - thinking-mode reasoning on tradeoffs
      - different model family from Claude avoids shared blind spots
      - fast enough for review loops
    complexity_min: 5
    complexity_max: 6
    notes: "Primary use: rubber duck reviewer for Claude Code output. Gemini family ensures fresh perspective."

  - tier: 5
    id: pro-high
    name: "Gemini 3.1 Pro (High)"
    provider: antigravity
    executor: agy
    model_flag: "gemini-3.1-pro-high"
    token_pool: agy_gemini_pro
    enabled: true
    context_window: 1000000
    tokens_per_call: medium_high
    speed: medium
    accuracy: medium_high
    frequency: moderate      # shares pool with Pro Low
    strengths:
      - complex middleware and auth flows
      - intricate business rule implementations
      - cross-cutting concerns
      - ML pipeline logic
    complexity_min: 5
    complexity_max: 6
    notes: "Higher compute within Pro pool. Use when Pro Low isn't enough."

  - tier: 6
    id: pro-low
    name: "Gemini 3.1 Pro (Low)"
    provider: antigravity
    executor: agy
    model_flag: "gemini-3.1-pro-low"
    token_pool: agy_gemini_pro
    enabled: true
    context_window: 1000000
    tokens_per_call: medium
    speed: medium_fast
    accuracy: medium_high
    frequency: moderate      # shares pool with Pro High, prefer this first in Pro tier
    strengths:
      - service layer implementations
      - repository patterns
      - moderately complex transformations
      - CI/CD pipeline configs
    complexity_min: 4
    complexity_max: 5
    notes: "Default Pro choice. Uses fewer tokens than Pro High. Same pool, prefer this."

  - tier: 7
    id: flash-high
    name: "Gemini 3.8 Flash (High)"
    provider: antigravity
    executor: agy
    model_flag: "gemini-3.8-flash-high"
    token_pool: agy_flash
    enabled: true
    context_window: 1000000
    tokens_per_call: low_medium
    speed: fast
    accuracy: medium
    frequency: high          # Flash pool is large, use freely
    strengths:
      - controllers and route handlers
      - validators and guards
      - hook implementations
      - standard CRUD operations
      - test scaffolding
    complexity_min: 3
    complexity_max: 4

  - tier: 8
    id: flash-med
    name: "Gemini 3.8 Flash (Medium)"
    provider: antigravity
    executor: agy
    model_flag: "gemini-3.8-flash-medium"
    token_pool: agy_flash
    enabled: true
    context_window: 1000000
    tokens_per_call: low
    speed: fast
    accuracy: medium_low
    frequency: very_high     # cheapest agy model, use for high-volume simple tasks
    strengths:
      - DTOs and request/response schemas
      - interfaces and type definitions
      - simple service stubs
      - enums and constants
      - config file generation
    complexity_min: 2
    complexity_max: 3

  - tier: 9
    id: flash-low
    name: "Gemini 3.8 Flash (Low)"
    provider: antigravity
    executor: agy
    model_flag: "gemini-3.8-flash-low"
    token_pool: agy_flash
    enabled: true
    context_window: 1000000
    tokens_per_call: very_low
    speed: very_fast
    accuracy: low
    frequency: can_spam      # lowest cost in Flash pool
    strengths:
      - simple repetitive patterns
      - barrel/index file generation
      - basic type aliases
      - placeholder implementations
    complexity_min: 1
    complexity_max: 2
    notes: "Low accuracy. Only for trivial, verifiable output. Always review."

  - tier: 10
    id: qwen-grunt
    name: "Qwen2.5-Coder 7b"
    provider: ollama
    executor: ollama
    model_flag: "Qwen2.5-Coder:7b"
    token_pool: local_ollama
    enabled: true
    context_window: 32768
    tokens_per_call: free
    speed: slow              # local inference on Apple Silicon ~15-40 tok/s
    accuracy: low_medium
    frequency: unlimited     # no token cost but CPU/GPU bound
    strengths:
      - pure boilerplate and scaffolding
      - file/folder structure generation
      - repetitive file cloning
      - markdown stubs
      - YAML/JSON/config templating
    complexity_min: 0
    complexity_max: 1
    notes: >
      Free but slow. Runs on local GPU/CPU, avoid long prompts (>500 tokens input).
      Expect 10-40 tok/s. Best for short, mechanical, verifiable output.
      Not suitable when network latency < local inference time.
