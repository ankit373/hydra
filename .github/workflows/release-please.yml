name: Release Please

# release-please watches for conventional commits on main and:
#   1. Opens a "Release PR" with bumped version + updated CHANGELOG.md, and the
#      docs version pins listed under extra-files in release-please-config.json
#   2. When the Release PR is merged, creates the tag + GitHub release
#      (it merges only after the maintainer approves it, see RELEASING.md)
#   3. This workflow then fans the release out to every channel (binaries,
#      Homebrew, npm, pip) via publish.yml, so a feature release auto-updates
#      everywhere with no manual steps. curl (install.sh) always resolves the
#      latest release at runtime, so it needs nothing.

on:
  push:
    branches:
      - main

# Write is granted per job, to the jobs that publish.
permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # No release-type input: with one set, the action ignores the config file,
          # and with it the extra-files that keep the docs version pins in step.
          # feat bumps minor, fix/perf patch, `!` or BREAKING CHANGE major.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish everywhere
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    # A called workflow gets at most its caller's permissions, so npm's OIDC needs id-token here too.
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
  # Installs the release from every channel. It runs even when a publish job
  # failed, since a half-published release is when a check matters most.
  smoke:
    name: Release smoke test
    needs: [release-please, publish]
    if: ${{ !cancelled() && needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/release-smoke.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      expect_latest: true
