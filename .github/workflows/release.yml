name: Release

# Fallback path for a manually pushed vX.Y.Z tag (release-please tags are handled
# by release-please.yml instead). Both paths funnel through publish.yml so every
# channel, binaries, Homebrew, npm, pip, is updated the same way.

on:
  push:
    tags:
      - "v*.*.*"

# Write is granted per job, to the jobs that publish.
permissions:
  contents: read

jobs:
  publish:
    # As release-please.yml grants it: npm's OIDC needs id-token in the caller too.
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
