name: Close shipped issues

# Backfill only. PRs merge into main now, so `Closes #n` closes the issue on merge.
# This used to close them at release time, when feature PRs targeted develop and
# the keyword never fired (#217). No release workflow calls it any more: on main
# its lineage walk would cover every PR ever merged. Run it by hand for a tag.

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sweep (e.g. v1.3.1)"
        required: true
        type: string
      dry_run:
        description: "List what would be closed without closing anything"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: close-shipped-issues
  cancel-in-progress: false

jobs:
  sweep:
    name: Close issues shipped in ${{ inputs.tag }}
    runs-on: ubuntu-latest
    steps:
      # Deliberately NOT checked out at the tag: the resolver script must be the
      # current one, or backfilling a tag from before it existed finds no script.
      # fetch-depth 0 brings the tag along anyway.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The lineage lives in a script so it can be tested against a real git
      # history rather than asserted as workflow text (cmd/hydra/shipped_lineage_test.go).
      - name: Collect the PRs in this release
        id: lineage
        env:
          TAG: ${{ inputs.tag }}
        run: .github/workflows/shipped_lineage.sh "${TAG}"

      - name: Close their issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          # A release that resolves nothing is the anomaly, and two in a row read
          # green while 89 issues stranded. A manual backfill resolving nothing is
          # ordinary, since re-running is documented as a no-op (#1140). So is a
          # hotfix release: Closes #n closed its issues on merge into main (#1351).
          STRICT: ${{ github.event_name != 'workflow_dispatch' && steps.lineage.outputs.promoted == 'true' }}
        run: python3 .github/workflows/close_shipped_issues.py
