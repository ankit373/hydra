version: 2
project_name: hydra

before:
  hooks:
    - go mod tidy

# ── Builds ────────────────────────────────────────────────────────────────────

builds:
  - id: hydra
    main: ./cmd/hydra
    binary: hyctl
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/ankit373/hydra/internal/build.Version={{.Version}}
      - -X github.com/ankit373/hydra/internal/build.Commit={{.ShortCommit}}
      - -X github.com/ankit373/hydra/internal/build.Date={{.CommitDate}}
      - -X github.com/ankit373/hydra/internal/build.BuiltBy=goreleaser
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    # No `ignore` here on purpose. windows/arm64 was excluded, but both the npm
    # and pip installers map process.arch/platform.machine() "arm64" straight to
    # windows/arm64 and request an archive that was therefore never uploaded —
    # so Windows-on-ARM installs 404'd (#262). The target builds and vets clean,
    # and ci.yml's cross-compile job now guards that for all six targets.

# ── Archives ──────────────────────────────────────────────────────────────────

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - LICENSE
      - NOTICE
      - README.md
      - CHANGELOG.md

# ── Checksums & Signing ───────────────────────────────────────────────────────

checksum:
  name_template: "checksums.txt"

# Phase 3: cosign signing — uncomment when COSIGN_KEY is configured
# signs:
#   - artifacts: checksum
#     cmd: cosign
#     args:
#       - sign-blob
#       - "--yes"
#       - "--output-signature=${signature}"
#       - "${artifact}"
#     env:
#       - COSIGN_EXPERIMENTAL=1

# ── SBOM ─────────────────────────────────────────────────────────────────────

sboms:
  - artifacts: archive
    documents:
      - "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}.sbom.json"

# ── Homebrew Tap ──────────────────────────────────────────────────────────────
# The tap formula (ankit373/homebrew-hydra → Formula/hyctl.rb) is currently
# maintained by scripts/update-tap-formula.sh, which regenerates it from the
# release archive + checksums after each release. GoReleaser's native `brews:`
# automation is intentionally disabled until a cross-repo push token
# (HOMEBREW_TAP_GITHUB_TOKEN) is added as a repo secret — the default
# GITHUB_TOKEN cannot push to the separate tap repository. To re-enable
# automation, add that secret and restore a `brews:` block here.

# ── Changelog ─────────────────────────────────────────────────────────────────

changelog:
  # release-please owns the release notes (see release.mode above), so
  # GoReleaser does not generate a changelog. NOTE: `use: git-cliff` was
  # invalid config (valid: git|github|github-native|gitlab) and failed schema
  # validation — disabling is correct now that notes come from release-please.
  disable: true

# ── GitHub Release ────────────────────────────────────────────────────────────

release:
  # release-please already creates the GitHub Release (with sectioned notes:
  # ✨ Features / 🐛 Fixes / ⚡ Performance) when its Release PR merges.
  # keep-existing ⇒ GoReleaser ONLY appends binaries / checksums / SBOM and
  # never overwrites those notes — so every release has notes, guaranteed.
  # (If the release doesn't exist yet, GoReleaser creates it using header/footer.)
  mode: keep-existing
  github:
    owner: ankit373
    name: hydra
  name_template: "v{{ .Version }}"
  header: |
    ## Hydra {{ .Tag }}

    > Full release notes: https://hydra.uvansa.com/changelog/{{ .Tag }}

  footer: |

    ---
    **Install / Upgrade**
    ```bash
    brew tap ankit373/hydra   # first install (one-time)
    brew install hyctl
    brew upgrade hyctl        # upgrade
    ```
    **Verify (after cosign enabled)**
    ```bash
    cosign verify-blob --signature checksums.txt.sig checksums.txt
    ```
    **Verify SHA**
    ```bash
    sha256sum --check checksums.txt
    ```

  # Auto-detect pre-release from tag (e.g. v1.0.0-rc.1, v1.0.0-beta.1)
  prerelease: auto

  # Draft releases are published immediately on tag push
  draft: false
