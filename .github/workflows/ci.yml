name: CI

on:
  pull_request:
    # release/v* is included because it is the UAT gate: it is what a release is
    # validated on, and where fixes land during validation. Leaving it out meant
    # a PR into a release branch reported "no checks reported" and was mergeable
    # with zero verification (#224). develop stays until no open PR targets it.
    branches: [main, develop, "release/v*"]

# Cancel any in-progress run for the same branch when a new commit is pushed.
concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

# Read-only by default; a job that needs more names it.
permissions:
  contents: read

jobs:
  # Hydra ships for darwin, linux and windows on both amd64 and arm64, but every
  # job in this file used to run on ubuntu-latest, so `go test` only ever ran on
  # Linux. That is how a Windows user came to see "0GB RAM · memory fully
  # occupied" and "memory pressure: low" at the same time (#258), and how the
  # non-git diff path came to return ("", nil), silently indistinguishable from
  # "no changes", on any machine without diff(1) (#260). Neither is exotic; both
  # are simply untested surfaces. The matrix is the fix (#255).
  go:
    name: Go build & test
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform's failure must never mask another's: the whole point is to
      # learn the full list in a single run.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        # Windows runners default to pwsh. Every `run:` block here is bash, and
        # Git Bash ships on the Windows image, so pinning the shell keeps one
        # script working on all three rather than forking it per OS.
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # gofmt/vet/staticcheck analyse source, not behaviour, their verdict does
      # not vary by runner OS, so they run once on Linux rather than three times.
      # Formatting is checked before anything expensive: cheapest failure to
      # produce, cheapest to fix.
      - name: Gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt'd:"
            echo "$unformatted"
            gofmt -d ./cmd ./internal
            exit 1
          fi

      - name: Vet
        if: runner.os == 'Linux'
        run: go vet ./...

      # staticcheck must be BUILT with the same toolchain it analyses. Its own
      # go.mod asks for go1.25, so a plain `go install` builds it on go1.25 and
      # it then rejects every go1.26 stdlib file it parses ("file requires newer
      # Go version"), failing the whole run. Pinning GOTOOLCHAIN to whatever
      # this module actually resolved to keeps the two in step without
      # hardcoding a version that would drift from go.mod.
      - name: Install staticcheck
        if: runner.os == 'Linux'
        run: GOTOOLCHAIN=$(go env GOVERSION) go install honnef.co/go/tools/cmd/staticcheck@2026.1

      - name: Staticcheck
        if: runner.os == 'Linux'
        run: staticcheck ./...

      - name: Build
        run: go build ./...

      # -count=1 defeats the test cache. setup-go restores the build cache across
      # runs, so without it a green result can be a replay of a previous run's
      # verdict rather than a fresh one, which is precisely the failure mode this
      # matrix exists to rule out.
      #
      # The race detector supports windows/amd64, but needs cgo and a C compiler.
      # If the Windows image ever stops shipping one, drop -race for that leg
      # rather than dropping the leg, an unraced Windows run still catches every
      # platform bug listed above.
      - name: Test
        run: go test ./... -race -count=1

      # Coverage floors, the zero-test-package allow-list and the skip budget.
      #
      # Linux only: all three are properties of the source, not of the runner,
      # and the numbers would differ per OS anyway, a test that legitimately
      # skips on Windows moves that package's coverage there. Enforcing one set
      # of floors on the platform they were measured on is the only version of
      # this that means anything.
      #
      # Run without -race: the detector does not change coverage, and this is a
      # second full pass over the suite.
      - name: Coverage floors
        if: runner.os == 'Linux'
        run: |
          go test ./internal/... ./cmd/... ./registry/... \
            -coverprofile=cover.out -count=1
          go run ./ci/covergate -profile cover.out -config ci/coverage-floors.txt

  # The desktop app ships for all three OSes, so its Go backend is tested on all
  # three too, same reasoning as the root job above (#257).
  desktop:
    name: Desktop backend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: true
          # desktop/ is a separate module; without this the cache key is computed
          # from the root go.sum and the two modules share a poisoned cache.
          cache-dependency-path: desktop/go.sum

      # desktop/ is its own module, so the root job's `./...` does not reach it.
      # Without this job its tests would silently never run.
      #
      # Scoped to ./api/... deliberately: desktop/main.go imports Wails, which
      # needs libwebkit2gtk to compile on Linux. A build tag used to exclude it,
      # but `wails build` generates bindings by compiling that package untagged,
      # so the tag broke the documented build command (#213). desktop/api, the
      # part with the tests, imports no UI framework at all, and main.go is
      # exercised by `wails build` on a machine that has a webview.
      - name: Gofmt
        if: runner.os == 'Linux'
        working-directory: desktop
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt'd:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: Vet
        if: runner.os == 'Linux'
        working-directory: desktop
        run: go vet ./api/...

      # Same reasoning as the root job: staticcheck must be built with the
      # toolchain it analyses.
      - name: Install staticcheck
        if: runner.os == 'Linux'
        working-directory: desktop
        run: GOTOOLCHAIN=$(go env GOVERSION) go install honnef.co/go/tools/cmd/staticcheck@2026.1

      - name: Staticcheck
        if: runner.os == 'Linux'
        working-directory: desktop
        run: staticcheck ./api/...

      - name: Test
        working-directory: desktop
        run: go test ./api/... -race -count=1

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      # Only fail on real errors (SC severity=error).
      # Warnings and style hints are surfaced but don't block the PR.
      #
      # Both installers are piped straight into `sh` by users following the
      # README, so a syntax error here reaches them mid-install. Naming them
      # explicitly rather than globbing keeps that intent visible, and is why
      # a new installer must be added to this list, not just written.
      - name: Lint shell scripts
        run: |
          shellcheck --severity=error install.sh install-app.sh

  # install.ps1's counterpart to the shellcheck job above. It runs on Windows
  # because that is where PowerShell's own parser lives, and because nobody
  # developing this repo on macOS or Linux can otherwise tell whether the
  # installer even parses, let alone works (#264).
  powershell:
    name: PowerShell lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # A parse error is the failure that matters most: install.ps1 is piped
      # straight into `iex`, so a syntax error reaches users as a wall of
      # PowerShell noise mid-install.
      - name: Parse install.ps1
        shell: pwsh
        run: |
          $errs = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1), [ref]$null, [ref]$errs)
          if ($errs) {
            $errs | ForEach-Object { Write-Host "::error::$($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }
          Write-Host "install.ps1 parses cleanly"

      # Best-effort, unlike the parse step above. PSScriptAnalyzer has to be
      # fetched from the PowerShell Gallery, and a gallery outage is not a
      # defect in install.ps1, blocking every unrelated PR on it is the wrong
      # trade. The parse check needs no network and is the real gate.
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          try {
            # Registering explicitly: the runner image occasionally starts with
            # no repositories, which surfaces as "No match was found for the
            # specified search criteria and module name 'PSScriptAnalyzer'".
            if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
              Register-PSRepository -Default -ErrorAction Stop
            }
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
            Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          } catch {
            Write-Host "::warning::PSScriptAnalyzer unavailable ($($_.Exception.Message)), skipping. The parse check above still ran."
            exit 0
          }

          $results = Invoke-ScriptAnalyzer -Path ./install.ps1 -Severity Error,Warning
          if ($results) {
            $results | Format-Table -AutoSize | Out-String | Write-Host
            # Errors block; warnings are surfaced, matching the shellcheck job's
            # --severity=error policy.
            if ($results | Where-Object { $_.Severity -eq 'Error' }) { exit 1 }
          }
          Write-Host "PSScriptAnalyzer: no errors"

  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # This job used to typecheck ui/, the Ink TUI removed in #197. It now
      # covers the desktop frontend, which had no CI coverage at all, its
      # types.ts mirrors the Go DTOs by hand, so a compile error there is
      # exactly the kind of drift CI should catch.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Typecheck
        working-directory: desktop/frontend
        run: npm run typecheck

      - name: Test
        working-directory: desktop/frontend
        run: npm test

      # jsdom has no layout, so `npm test` cannot see any of the below. Three
      # defects shipped in one day that only a browser could catch, one of them
      # a regression against a width an earlier PR had verified by hand (#1127).
      - name: Cache the browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('desktop/frontend/package-lock.json') }}

      - name: Install Chromium
        working-directory: desktop/frontend
        run: npx playwright install --with-deps chromium

      - name: Layout check
        working-directory: desktop/frontend
        run: npm run layout

      # The production bundle must build, not merely typecheck, `wails build`
      # runs this exact command before it compiles any Go.
      - name: Build
        working-directory: desktop/frontend
        run: npm run build

  # The website, the desktop app and the TUI all style from files generated out
  # of design/tokens. Rebuilding must change nothing: a hand edit to a generated
  # file, or a token change committed without its outputs, fails here (#1339).
  design-tokens:
    name: Design tokens up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: design/package-lock.json

      - name: Install dependencies
        working-directory: design
        run: npm ci

      # The build also fails on any declared WCAG 2 or APCA floor it misses.
      - name: Rebuild tokens
        working-directory: design
        run: npm run build

      # status, not diff: a generated file the rebuild created but nobody
      # committed is untracked, and `git diff` would pass it.
      - name: Generated files match the token source
        run: |
          paths="design DESIGN.md docs/assets/tokens.css desktop/frontend/src/tokens.generated.css desktop/window_gen.go internal/tui/tokens_gen.go"
          drift=$(git status --porcelain -- $paths)
          if [ -n "$drift" ]; then
            echo "Generated files are out of date; run: cd design && npm ci && npm run build"
            echo "$drift"
            git diff -- $paths
            exit 1
          fi

  # Every target Hydra ships (and windows/arm64, which it should, see #262)
  # compiles and vets clean today. Nothing guarded that, so a Unix-only syscall
  # or a platform-specific import could land with CI fully green, because CI only
  # ever built for the runner's own OS.
  #
  # This is deliberately build+vet, not test: it is a compile-time guard covering
  # targets that have no runner (linux/arm64, windows/arm64). Behaviour is the
  # `go` matrix's job. Together they cover build for 6 targets and behaviour for 3.
  cross-compile:
    name: Cross-compile (6 targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and vet every release target
        run: |
          set -u
          failed=""
          for t in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 \
                   windows/amd64 windows/arm64; do
            export GOOS="${t%/*}" GOARCH="${t#*/}"
            printf '%-16s' "$t"
            if ! out=$(go build ./... 2>&1); then
              echo "BUILD FAILED"; echo "$out"
              failed="$failed $t(build)"; continue
            fi
            if ! out=$(go vet ./... 2>&1); then
              echo "VET FAILED"; echo "$out"
              failed="$failed $t(vet)"; continue
            fi
            echo "ok"
          done
          if [ -n "$failed" ]; then
            echo "::error::cross-compile failed for:$failed"
            exit 1
          fi

  yaml-lint:
    name: YAML validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Validate registry YAML files
        run: |
          for f in registry/*.yaml; do
            echo "Checking $f"
            yq '.' "$f" > /dev/null
          done

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    # Gitleaks reads the PR's commit list through the API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

  # Known vulnerabilities in what the code calls, stdlib included. The toolchain
  # pin had drifted 19 stdlib advisories behind with nothing to say so.
  govulncheck:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Scan the CLI
        run: govulncheck ./...

      # ./api/... only, as in the desktop job: main.go needs the webview headers.
      - name: Scan the desktop backend
        working-directory: desktop
        run: govulncheck ./api/...

  # Blocks a PR that adds a dependency with a known high-severity advisory.
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  # Workflows run with the repo's token and secrets, so they are linted as code.
  workflow-security:
    name: Workflow security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Warning and up, matching the shellcheck job's bar for scripts.
      - name: actionlint
        env:
          SHELLCHECK_OPTS: --severity=warning
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      # Policy in .github/zizmor.yml; the token lets it check pinned commits upstream.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.32.0 --min-severity high .github/workflows

  # Mergify reads its config from main only, so a broken file is caught here, before it merges.
  # The invariants (check names, author pins) are cmd/hydra/mergify_config_test.go.
  mergify-config:
    name: Mergify config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate against Mergify's schema
        run: |
          pipx run check-jsonschema==0.39.0 \
            --schemafile https://docs.mergify.com/mergify-configuration-schema.json .mergify.yml

  # The only place desktop/main.go is compiled. The `desktop` job above is
  # scoped to ./api/... because main.go imports Wails, so without this the Wails
  # wiring, bindings, embedded frontend, app setup, is verified by nobody and
  # breaks are found only when someone runs `wails build` by hand (#227).
  #
  # Linux only: it catches Go-level breakage for a fraction of the cost of a
  # three-OS matrix on every PR. The full matrix runs on RC and release builds.
  desktop-app:
    name: Desktop app build
    uses: ./.github/workflows/desktop-build.yml
    with:
      version: ci
      targets: '[{"runner":"ubuntu-latest","platform":"linux/amd64","goos":"linux","arch":"amd64","tags":"webkit2_41"}]'

  # A PR into main is what ships: merging it tags and publishes. So it builds what
  # publish.yml builds, all 5 desktop targets and GoReleaser, before it can merge (#1353).
  release-desktop:
    name: Release desktop build
    if: github.base_ref == 'main'
    uses: ./.github/workflows/desktop-build.yml
    with:
      version: ci

  release-binaries:
    name: Release build (GoReleaser)
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # Uncached, like the release it rehearses.
          cache: false

      # Not --snapshot, which swallowed the missing-tag error (#821). A local tag
      # like edge.yml's, never pushed; the -ci suffix cannot collide with a release.
      - name: Create the tag GoReleaser reads
        id: ver
        run: |
          released=$(python3 -c 'import json; print(json.load(open(".release-please-manifest.json"))["."])')
          tag="v${released}-ci.g$(git rev-parse --short HEAD)"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "${tag}" -m "release build check"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Build every release archive
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # Exact, like the release workflows (#821).
          version: "2.18.2"
          args: release --clean --skip=publish,sign,sbom,validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.ver.outputs.tag }}

  # The soak rules in RELEASING.md section 3: a large release needs an RC of
  # this version at least 48 hours old, a major one an RC at least 7 days old
  # with no feat since. Only the release-please queue requires this check.
  release-gates:
    name: Release gates
    if: startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Size
        id: size
        env:
          BASE_REF: ${{ github.base_ref }}
        run: ./scripts/release-size.sh HEAD "origin/$BASE_REF" | tee -a "$GITHUB_OUTPUT"

      - name: Check the RC soak
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SIZE: ${{ steps.size.outputs.size }}
        run: |
          next="v$(jq -r '."."' .release-please-manifest.json)"
          case "$SIZE" in
            large) need_hours=48 ;;
            major) need_hours=168 ;;
            *) echo "$next is $SIZE: no RC needed."; exit 0 ;;
          esac

          # Read now, not from the event: a label added later and a re-run of
          # this job is how the fast lane gets through.
          labels=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels -q '.labels[].name')
          if grep -qx release:urgent <<<"$labels"; then
            echo "::warning::$next is $SIZE but labelled release:urgent, so the RC soak is skipped."
            exit 0
          fi

          rc=$(git for-each-ref --sort=-creatordate --count=1 \
                 --format='%(refname:short) %(creatordate:unix)' "refs/tags/$next-rc.*")
          if [ -z "$rc" ]; then
            echo "::error::$next is $SIZE and has no RC. Cut one with: gh workflow run rc.yml -f sha=<sha>. Or label the PR release:urgent and re-run this check."
            exit 1
          fi
          rc_tag=${rc% *}
          age_hours=$(( ($(date +%s) - ${rc#* }) / 3600 ))
          if [ "$age_hours" -lt "$need_hours" ]; then
            echo "::error::$rc_tag is ${age_hours}h old; a $SIZE release needs ${need_hours}h."
            exit 1
          fi

          if [ "$SIZE" = major ]; then
            feats=$(git log --no-merges --format=%s "$rc_tag..HEAD" | grep -E '^feat(\(.+\))?!?: ' || true)
            if [ -n "$feats" ]; then
              echo "::error::features landed after $rc_tag; a major release takes only fixes after its RC. Cut a new RC."
              echo "$feats"
              exit 1
            fi
          fi
          echo "$next is $SIZE and $rc_tag is ${age_hours}h old: ok."

