name: Release Please

# release-please watches for conventional commits on main and:
#   1. Opens a "Release PR" with bumped version + updated CHANGELOG.md
#   2. When the Release PR is merged, creates the tag + GitHub release
#   3. This workflow then fans the release out to every channel (binaries,
#      Homebrew, npm, pip) via publish.yml, so a feature release auto-updates
#      everywhere with no manual steps. curl (install.sh) always resolves the
#      latest release at runtime, so it needs nothing.

on:
  push:
    branches:
      - main

# Write is granted per job, to the jobs that publish.
permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: go
          # Conventional commits determine version bump:
          #   feat:     → minor bump (1.1.0 → 1.2.0)
          #   fix:      → patch bump (1.1.0 → 1.1.1)
          #   feat!: or BREAKING CHANGE → major bump (1.1.0 → 2.0.0)
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish everywhere
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    # A called workflow gets at most its caller's permissions, so npm's OIDC needs id-token here too.
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  # The tag release-please creates is made with GITHUB_TOKEN, and events raised by
  # that token start no workflow, so this has to hang off the job graph, like publish.
  close-issues:
    name: Close shipped issues
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/close-shipped-issues.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
