name: CLA

# Bridge: CLA Assistant holds the signature and posts license/cla. Until main's
# .mergify.yml requires license/cla itself, this check mirrors it under the old name.
# A signature after this ran is picked up by re-running this check or by the next push.
# zizmor flags this trigger; safe here as nothing is checked out and only the API is read.
on:  # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  signed:
    name: Contributor has signed
    runs-on: ubuntu-latest
    permissions:
      statuses: read
    steps:
      - name: Read CLA Assistant's license/cla status
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          SHA: ${{ github.event.pull_request.head.sha }}
          NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Bots act for this repo and cannot sign; CLA Assistant allowlists them too.
          case "$AUTHOR" in
            'dependabot[bot]'|'github-actions[bot]'|'release-please[bot]')
              echo "::notice::$AUTHOR is a bot acting for this repo; CLA does not apply."
              exit 0 ;;
          esac

          # CLA Assistant usually posts within seconds of the push; wait briefly for it.
          state=""
          for attempt in 1 2 3; do
            state="$(gh api "repos/$REPO/commits/$SHA/status" \
              --jq '[.statuses[] | select(.context == "license/cla") | .state][0] // ""')"
            [ "$state" = success ] && break
            [ "$attempt" = 3 ] || sleep 20
          done

          if [ "$state" = success ]; then
            echo "$AUTHOR has signed the CLA (license/cla is green)."
            exit 0
          fi

          link="https://cla-assistant.io/$REPO?pullRequest=$NUMBER"
          echo "::error::Thanks for the pull request, @$AUTHOR! Before it can merge, please sign the CLA: $link"
          echo "It is one click with your GitHub account and covers all your future pull requests too."
          echo "CLA.md explains what it says. Once signed, re-run this check or push again."
          echo "license/cla is '${state:-not posted yet}'."
          exit 1
