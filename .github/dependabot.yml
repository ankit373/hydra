version: 2

# target-branch: develop on every entry, and NOT the omit-and-let-it-default
# option. Dependabot's default is the repo's default branch, main here, which
# is exactly what CLAUDE.md's branch policy forbids: "Never open a PR directly
# to main from a feature branch." Every dependency PR was landing on main
# unreviewed by that policy until this was noticed (#334). main only ever moves
# via a release-branch PR or a hotfix; a dependency bump is neither.
# cooldown: a release must be 7 days old before Dependabot proposes it, so a
# compromised or yanked version has time to be caught upstream first.
updates:
  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: develop
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The hyctl module at the root. Majors stay ungrouped so each one is reviewed alone.
  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: develop
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 3
    groups:
      hyctl-go:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The desktop app is its own Go module (see desktop/go.mod), so the root
  # ecosystem entry does not reach it. Grouped into one PR per week, Wails
  # pulls ~25 transitive deps and ungrouped updates would bury the queue.
  - package-ecosystem: "gomod"
    directory: "/desktop"
    target-branch: develop
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 3
    groups:
      desktop-go:
        patterns: ["*"]

  # Desktop frontend (React/TS).
  - package-ecosystem: "npm"
    directory: "/desktop/frontend"
    target-branch: develop
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 3
    groups:
      desktop-frontend:
        patterns: ["*"]
