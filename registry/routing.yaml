# Hydra Routing Map, THE ENUM FILE
# ─────────────────────────────────────────────────────────────────────────────
# This is your single enum. Change a value here → every domain updates.
# Domains and skills reference keys (e.g. SIMPLE), never tier numbers directly.
#
# Example: change SIMPLE from 8 to 7 → short summaries and labels now go one level up
# Example: change GRUNT from 10 to 9 → mechanical work now leaves the local model
#
# Keys map to routing levels defined in models.yaml (1 = most capable)
#
# The router reads this file. A copy at $HYDRA_HOME/registry/routing.yaml wins
# over the one in the binary, and must list every key below: a partial override
# is refused rather than silently falling back for the keys it omits.
# ─────────────────────────────────────────────────────────────────────────────

version: "1.0"

routing_map:

  # Mechanical work: reformat, split, dedupe, fill a template. Local and free.
  GRUNT:      10

  # Trivial work: fix a typo, pick a word, set a constant
  TRIVIAL:    9

  # Short summaries, one-field extraction, labels, simple code
  SIMPLE:     8

  # A reply or a page of writing, routine code
  STANDARD:   7

  # Several fields or steps at once: a structured extraction, a checked rewrite
  MODERATE:   6

  # Long documents, multi-step analysis, tricky code
  COMPLEX:    5

  # Weighing trade-offs, non-trivial reasoning or algorithms, a second opinion
  HARD:       4

  # Very hard, long chains of reasoning, large rewrites or refactors
  VERY_HARD:  3

  # Strategy, hard reasoning, architecture
  EXPERT:     2

  # The work you keep for your strongest model, never dispatched
  CORE:       1
