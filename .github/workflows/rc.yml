name: RC Build

# An RC is cut from a commit on main by hand: `gh workflow run rc.yml -f sha=<sha>`.
# The version defaults to the one in release-please's open release PR (RELEASING.md).
# A push to a release/vX.Y.Z branch still builds one, for a release cut that way.
on:
  push:
    # Version-shaped only: a carry branch (release/vX.Y.Z-to-main) is not a release (#1317).
    branches:
      - "release/v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit on main to build (default: main's head)"
        required: false
        type: string
      release:
        description: "Release the RC is for, e.g. 1.8.0 (default: the open release PR's version)"
        required: false
        type: string

# Write is granted per job, to the jobs that publish.
permissions:
  contents: read

jobs:
  rc:
    name: Build & publish RC release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      commit: ${{ steps.ver.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # No cache: a release builds only what it checked out, nothing another run saved.
          cache: false

      - name: Compute RC version
        id: ver
        env:
          INPUT_RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse --short HEAD)

          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # An RC is a candidate for main's next release, so it must come from main.
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::$(git rev-parse HEAD) is not on main; an RC is cut from main"
              exit 1
            fi
            V="${INPUT_RELEASE#v}"
            if [ -z "$V" ]; then
              # The release PR's manifest holds the version the next release will take.
              PR_BRANCH=$(git for-each-ref --count=1 --format='%(refname)' \
                'refs/remotes/origin/release-please--branches--main*')
              if [ -z "$PR_BRANCH" ]; then
                echo "::error::no open release PR to take the version from; pass -f release=X.Y.Z"
                exit 1
              fi
              V=$(git show "${PR_BRANCH}:.release-please-manifest.json" \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["."])')
            fi
            SOURCE=main
          else
            # Branch is release/v1.2.0 → extract semver
            V="${GITHUB_REF_NAME#release/v}"
            SOURCE="${GITHUB_REF_NAME}"
          fi
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::RC version '$V' is not X.Y.Z"
            exit 1
          fi
          SEMVER="v${V}"

          # Count how many RC tags already exist for this version
          RC_COUNT=$(git tag --list "${SEMVER}-rc.*" | wc -l | tr -d ' ')
          RC_NUM=$((RC_COUNT + 1))
          RC_TAG="${SEMVER}-rc.${RC_NUM}"

          echo "version=${RC_TAG}" >> "$GITHUB_OUTPUT"
          echo "tag=${RC_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "source=${SOURCE}" >> "$GITHUB_OUTPUT"
          # GoReleaser's {{ .Version }} is the semver without the leading v, so
          # the archive filenames need this form and not the tag (#759).
          echo "semver=${RC_TAG#v}" >> "$GITHUB_OUTPUT"

      # GoReleaser resolves GORELEASER_CURRENT_TAG and reads that tag's
      # contents, which --skip=validate does not skip (#821). Annotated so the
      # tag carries its own message; a lightweight one reads the commit's.
      #
      # A tag object carries a tagger, and the runner has no git identity: the
      # OS fallback derives an empty name there. -c rather than `git config`,
      # so it stays out of the other steps that run git (#824).
      - name: Create the tag GoReleaser reads
        run: |
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "${{ steps.ver.outputs.tag }}" -m "RC ${{ steps.ver.outputs.sha }}"

      - name: Build RC binaries
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # Exact, not latest or ~> v2: 2.17.1 and 2.18.1 disagree on whether a
          # missing tag is fatal, which killed 24 edge builds unnoticed (#821).
          version: "2.18.2"
          # --snapshot made GoReleaser compute its own 0.0.0-SNAPSHOT version
          # and ignore the tag, so every RC shipped CLI archives that could not
          # say which release they stood for (#705). It was also swallowing the
          # missing-tag error, which is why dropping it broke the build; the tag
          # above is what addresses that, not --skip=validate, which only skips
          # the git *state* checks (#821).
          args: release --clean --skip=publish,sign,sbom,validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.ver.outputs.version }}

      # gh release create refuses a tag that exists locally but not on the
      # remote, so the build-only tag goes before it creates the real one.
      - name: Drop the local build tag
        run: git tag -d "${{ steps.ver.outputs.tag }}"

      - name: Publish RC release
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" dist/*.tar.gz dist/*.zip dist/checksums.txt \
            --target "$COMMIT" \
            --title "RC, ${{ steps.ver.outputs.version }}" \
            --notes "$(cat <<EOF
          > 🧪 **This is a release candidate**, built from \`${SOURCE}\` for testing.
          > Do not use in production. Stable release pending sign-off.

          **Branch**: \`${SOURCE}\`
          **Commit**: \`${{ steps.ver.outputs.sha }}\`
          **Version**: \`${{ steps.ver.outputs.version }}\`

          **Install RC build**
          \`\`\`bash
          # macOS (Apple Silicon)
          curl -L https://github.com/ankit373/hydra/releases/download/${{ steps.ver.outputs.tag }}/hydra_${{ steps.ver.outputs.semver }}_darwin_arm64.tar.gz | tar xz
          sudo mv hyctl /usr/local/bin/
          \`\`\`
          EOF
          )" \
            --prerelease \
            --latest=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ steps.ver.outputs.commit }}
          SOURCE: ${{ steps.ver.outputs.source }}

  # An RC needs the app, not just the CLI. Without this the RC that gets signed
  # off contains no desktop build at all (#227).
  desktop:
    name: Desktop app
    needs: rc
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-build.yml
    with:
      version: ${{ needs.rc.outputs.version }}
      tag: ${{ needs.rc.outputs.tag }}
      ref: ${{ needs.rc.outputs.commit }}
      upload: true
