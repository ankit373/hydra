name: Publish (all channels)

# Single source of truth for shipping a release everywhere: binaries + checksums
# (GitHub release), Homebrew tap, npm, and pip. curl (install.sh) needs nothing,
# it always resolves the latest release at runtime.
#
# Called automatically by release-please.yml when a release is created, and
# manually via workflow_dispatch (e.g. to (re)publish an existing tag).
#
# A channel whose credential is missing fails, so a release cannot read green while a
# registry never got it (#1315):
#   HOMEBREW_TAP_GITHUB_TOKEN  → PAT with push access to ankit373/homebrew-hydra
#   PYPI_API_TOKEN             → PyPI API token (publish)
# Zenodo is optional and skipped while its token is unset:
#   ZENODO_TOKEN               → Zenodo token, scopes deposit:write and deposit:actions
#   vars.ZENODO_CONCEPT_ID     → the concept record id, set after the first upload
# npm uses trusted publishing (OIDC), so it needs no secret; NPM_TOKEN is only a
# fallback until the trusted publisher is set on npmjs.com.

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.0.1)"
        required: true
        type: string

# Write only where a job uploads to the release; the rest read.
permissions:
  contents: read

# Scripts read the tag as a variable, never spliced into them as ${{ }}.
env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  binaries:
    name: Binaries + checksums (GoReleaser)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      # Safe to re-run. checksums.txt lists every archive and SBOM GoReleaser
      # made, whatever the format, so it is the manifest to check against:
      #   none of GoReleaser's assets   -> build
      #   all of them                   -> skip, the channels below still run
      #   some of them                  -> fail with the list; rebuilding would
      #                                    change checksums brew already pinned
      - name: Check for existing artifacts
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          have=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                   --json assets -q '.assets[].name' 2>/dev/null || true)
          ours=$(printf '%s\n' "$have" | grep -E '^(hydra_.*|checksums\.txt)$' || true)
          if [ -z "$ours" ]; then
            echo "No GoReleaser assets yet, building."
            echo "has_assets=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s\n' "$ours" | grep -qx checksums.txt; then
            echo "::error::$RELEASE_TAG has some GoReleaser assets but no checksums.txt, so the upload stopped part way:"
            printf '%s\n' "$ours" | sed 's/^/  /'
            echo "Delete them (gh release delete-asset $RELEASE_TAG <name>) and re-run."
            exit 1
          fi
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" -p checksums.txt -D "$RUNNER_TEMP"
          missing=$(awk '{print $2}' "$RUNNER_TEMP/checksums.txt" | grep -vxF -f <(printf '%s\n' "$ours") || true)
          if [ -n "$missing" ]; then
            echo "::error::$RELEASE_TAG is missing assets listed in checksums.txt:"
            printf '%s\n' "$missing" | sed 's/^/  /'
            echo "Delete the GoReleaser assets (hydra_* and checksums.txt) and re-run."
            exit 1
          fi
          echo "All $(wc -l < "$RUNNER_TEMP/checksums.txt") assets in checksums.txt are on the release, skipping GoReleaser."
          echo "has_assets=1" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        if: ${{ steps.check.outputs.has_assets == '0' }}
        with:
          go-version-file: go.mod
          # No cache: a release builds only what it checked out, nothing another run saved.
          cache: false
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        if: ${{ steps.check.outputs.has_assets == '0' }}
      - name: GoReleaser (build + upload to the release)
        if: ${{ steps.check.outputs.has_assets == '0' }}
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # Exact, not latest or ~> v2: 2.17.1 and 2.18.1 disagree on whether a
          # missing tag is fatal, which killed 24 edge builds unnoticed (#821).
          version: "2.18.2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ inputs.tag }}

  homebrew:
    name: Homebrew tap
    needs: binaries
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Update tap formula
        if: ${{ env.TAP_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: ./scripts/update-tap-formula.sh "$RELEASE_TAG"
      - name: Missing token
        if: ${{ env.TAP_TOKEN == '' }}
        run: echo "::error::HOMEBREW_TAP_GITHUB_TOKEN is not set, so the tap was not updated." && exit 1

  npm:
    name: npm
    needs: binaries
    runs-on: ubuntu-latest
    # id-token lets npm verify this run by OIDC (trusted publishing), so no token can expire.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g npm@11
      - name: Publish
        working-directory: npm
        env:
          # Used only while no trusted publisher is configured; npm prefers OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -o pipefail
          VERSION="${RELEASE_TAG#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          # npm never takes a version twice, so one already there means a re-run.
          if [ "$(npm view "hyctl@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "hyctl@$VERSION is already on npm, nothing to publish."
            exit 0
          fi
          if ! npm publish --access public 2>&1 | tee "$RUNNER_TEMP/npm.log"; then
            if grep -q "cannot publish over the previously published versions" "$RUNNER_TEMP/npm.log"; then
              echo "hyctl@$VERSION was published by an earlier attempt."
              exit 0
            fi
            exit 1
          fi

  pip:
    name: pip / PyPI
    needs: binaries
    runs-on: ubuntu-latest
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build + publish
        if: ${{ env.PYPI_API_TOKEN != '' }}
        working-directory: pip
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
          sed -i "s/^__version__ = .*/__version__ = \"$VERSION\"/" hyctl/__init__.py
          python -m pip install --upgrade build twine
          python -m build
          # PyPI never takes a file twice; skip the ones an earlier run uploaded.
          python -m twine upload --skip-existing dist/*
      - name: Missing token
        if: ${{ env.PYPI_API_TOKEN == '' }}
        run: echo "::error::PYPI_API_TOKEN is not set, so PyPI did not get this release." && exit 1

  desktop:
    name: Desktop app
    needs: binaries
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-build.yml
    with:
      version: ${{ inputs.tag }}
      tag: ${{ inputs.tag }}
      # The tag, not the dispatching branch, so re-publishing an old tag builds that tag.
      ref: ${{ inputs.tag }}
      upload: true

  # Stable releases only: Zenodo keeps every version for good, so an edge or RC
  # build would be a permanent DOI for something that never shipped. Nothing
  # waits on this job, so a Zenodo outage fails it without holding up a channel.
  zenodo:
    name: Zenodo archive
    needs: binaries
    if: ${{ !contains(inputs.tag, '-') }}
    runs-on: ubuntu-latest
    env:
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
      ZENODO_CONCEPT_ID: ${{ vars.ZENODO_CONCEPT_ID }}
    steps:
      - name: Missing token
        if: ${{ env.ZENODO_TOKEN == '' }}
        run: echo "::notice::ZENODO_TOKEN is not set, so this release is not archived on Zenodo."
      - uses: actions/checkout@v7
        if: ${{ env.ZENODO_TOKEN != '' }}
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Upload and publish
        if: ${{ env.ZENODO_TOKEN != '' }}
        run: ./scripts/zenodo-publish.sh "$RELEASE_TAG"
